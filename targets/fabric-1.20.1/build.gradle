plugins {
    id 'net.fabricmc.fabric-loom-remap'
}

ext.targetMinecraftVersion = rootProject.minecraft_1201
ext.targetLoader = 'fabric'
ext.targetJavaVersion = 17

apply from: rootProject.file('gradle/target-common.gradle')

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_1201}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_1201}"
}

loom {
    runs {
        client {
            client()
            name = 'Fabric 1.20.1 Client'
        }
        server {
            server()
            name = 'Fabric 1.20.1 Server'
            programArg '--nogui'
        }
    }
}
