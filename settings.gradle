pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases/' }
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'Locate-Fixer'

include 'forge-1.20.1'
include 'fabric-1.20.1'
include 'neoforge-1.21.1'
include 'fabric-1.21.1'

project(':forge-1.20.1').projectDir = file('targets/forge-1.20.1')
project(':fabric-1.20.1').projectDir = file('targets/fabric-1.20.1')
project(':neoforge-1.21.1').projectDir = file('targets/neoforge-1.21.1')
project(':fabric-1.21.1').projectDir = file('targets/fabric-1.21.1')
