name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - forge-1.20.1
          - fabric-1.20.1
          - neoforge-1.21.1
          - fabric-1.21.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build ${{ matrix.target }}
        run: ./gradlew ":${{ matrix.target }}:build" --no-daemon --console=plain

      - name: Upload ${{ matrix.target }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: locatefixer-${{ matrix.target }}
          if-no-files-found: error
          path: |
            targets/${{ matrix.target }}/build/libs/*.jar
            !targets/${{ matrix.target }}/build/libs/*-sources.jar
