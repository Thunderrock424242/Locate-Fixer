plugins {
    id 'base'
    id 'net.neoforged.moddev' version '2.0.143' apply false
    id 'net.neoforged.moddev.legacyforge' version '2.0.143' apply false
    id 'net.fabricmc.fabric-loom-remap' version '1.16.3' apply false
}

group = mod_group_id
version = mod_version

tasks.register('buildAll') {
    group = 'build'
    description = 'Builds every supported Minecraft version and mod loader.'
    dependsOn subprojects.collect { it.tasks.named('build') }
}

tasks.register('collectArtifacts', Sync) {
    group = 'build'
    description = 'Collects the production jars from every supported target.'
    dependsOn tasks.named('buildAll')
    into layout.buildDirectory.dir('distributions')
    subprojects.each { target ->
        from(target.layout.buildDirectory.dir('libs')) {
            include "*-${rootProject.version}.jar"
            exclude '*-sources.jar', '*-dev.jar', '*-dev-shadow.jar'
        }
    }
}

tasks.named('build') {
    dependsOn tasks.named('buildAll')
}
